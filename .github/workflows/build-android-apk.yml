
name: Rebuild Komi Store Thai APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out upload parts
        uses: actions/checkout@v4

      - name: Reassemble source ZIP
        run: |
          cat komi-thai.part01 komi-thai.part02 > source.zip
          unzip -q source.zip -d extracted
          cp -a extracted/komi-store-1.9.4/. .

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android debug APK
        run: chmod +x ./gradlew && ./gradlew :androidApp:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: komi-store-1.9.4-thai-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
